<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="theme-color" content="#0b1723">
    <title>UrbanGround: From Local Perception to Spatial Agency in a Real-Scale City</title>
    <link rel="icon" href="TemplateData/icon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- GitHub Pages cannot emit COOP/COEP response headers. This vendored
         service worker adds them locally so the multithreaded Player keeps
         SharedArrayBuffer, PhysX, and the desktop-equivalent interaction. -->
    <script src="coi-serviceworker.js?v=20260817b"></script>
  </head>
  <body>
    <main id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="0" aria-label="UrbanGround Unity game"></canvas>
      <section id="loading" aria-live="polite">
        <img src="TemplateData/icon.png" alt="" width="112" height="112">
        <h1><span class="urban">Urban</span>Ground</h1>
        <p id="loading-status">Preparing Unity WebAssembly</p>
        <div class="track"><div id="progress"></div></div>
        <small>The first load includes the Unity engine and city sandbox.</small>
      </section>
      <div id="warning"></div>
      <button id="fullscreen" type="button" aria-label="Enter fullscreen">⛶</button>
    </main>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#loading");
      const status = document.querySelector("#loading-status");
      const progress = document.querySelector("#progress");
      const warning = document.querySelector("#warning");
      const fullscreen = document.querySelector("#fullscreen");
      let unityInstance = null;
      let agentConfigured = false;
      let agentRunning = false;
      let agentStartRequest = null;
      let parentBridgeNamespace = null;

      const primaryBridgeNamespace = "urbanground";
      const legacyBridgeNamespace = "urbanarena";
      const bridgeNamespaces = [primaryBridgeNamespace, legacyBridgeNamespace];
      const bridgeType = (namespace, suffix) => `${namespace}:${suffix}`;
      const bridgeNamespaceFor = (type, suffix) => bridgeNamespaces.find(
        namespace => type === bridgeType(namespace, suffix)
      ) || null;
      const acceptParentBridgeMessage = (type, suffix) => {
        const namespace = bridgeNamespaceFor(type, suffix);
        if (!namespace) return false;
        if (!parentBridgeNamespace) parentBridgeNamespace = namespace;
        return parentBridgeNamespace === namespace;
      };

      const postParentBridgeMessage = (suffix, payload) => {
        const namespaces = parentBridgeNamespace ? [parentBridgeNamespace] : bridgeNamespaces;
        namespaces.forEach(namespace => {
          window.parent.postMessage({
            type: bridgeType(namespace, suffix),
            ...(payload || {})
          }, window.location.origin);
        });
      };

      const postServiceWorkerAgentMessage = (action, payload) => {
        const controller = navigator.serviceWorker?.controller;
        if (!controller) return false;
        bridgeNamespaces.forEach(namespace => {
          controller.postMessage({
            type: `${namespace}Agent${action}`,
            ...(payload || {})
          });
        });
        return true;
      };

      const clearStoredAgentConfig = () => {
        postServiceWorkerAgentMessage("Clear");
        agentConfigured = false;
      };

      const clearAgent = () => {
        const hadUnity = Boolean(unityInstance);
        agentStartRequest = null;
        if (unityInstance) unityInstance.SendMessage("LLMAgent", "StopAgent");
        agentRunning = false;
        clearStoredAgentConfig();
        if (!hadUnity) notifyParent("stopped");
      };

      const notifyParent = (state, message) => {
        postParentBridgeMessage("agent-state", { state, message });
      };

      const receiveAgentState = (state, message) => {
        if (state === "running") agentRunning = true;
        if (state === "stopped" || state === "finished") {
          agentRunning = false;
          clearStoredAgentConfig();
        }
        notifyParent(state, message);
      };
      window.UrbanGroundReceiveAgentState = receiveAgentState;
      window.UrbanArenaReceiveAgentState = receiveAgentState;

      const startConfiguredAgent = () => {
        if (!unityInstance || !agentConfigured || !agentStartRequest) return;
        const { instruction, taskId } = agentStartRequest;
        unityInstance.SendMessage("LLMAgent", "SetInstruction", String(instruction || ""));
        if (taskId) unityInstance.SendMessage("LLMAgent", "LoadTaskAndStart", String(taskId));
        else unityInstance.SendMessage("LLMAgent", "StartFreeExploration");
        agentStartRequest = null;
        canvas.blur();
      };

      window.addEventListener("message", event => {
        if (event.origin !== window.location.origin || event.source !== window.parent) return;
        if (acceptParentBridgeMessage(event.data?.type, "agent-start")) {
          const { endpoint, apiKey, model, instruction, taskId } = event.data;
          let parsed;
          try { parsed = new URL(endpoint); } catch { return notifyParent("error", "The model endpoint URL is invalid."); }
          if (!["http:", "https:"].includes(parsed.protocol) || !apiKey || !model) {
            return notifyParent("error", "URL, API Key, and Model name are required.");
          }
          if (!navigator.serviceWorker?.controller) {
            return notifyParent("error", "The secure browser runtime is not ready. Reload the page and try again.");
          }
          postServiceWorkerAgentMessage("Configure", {
            endpoint: parsed.href,
            apiKey: String(apiKey),
            model: String(model)
          });
          agentConfigured = true;
          agentStartRequest = {
            instruction: String(instruction || ""),
            taskId: String(taskId || "")
          };
          startConfiguredAgent();
        }
        if (acceptParentBridgeMessage(event.data?.type, "agent-stop")) {
          clearAgent();
        }
        if (acceptParentBridgeMessage(event.data?.type, "agent-instruction") && unityInstance) {
          unityInstance.SendMessage("LLMAgent", "SetInstruction", String(event.data.instruction || ""));
        }
        if (acceptParentBridgeMessage(event.data?.type, "task-catalog-request") && unityInstance) {
          unityInstance.SendMessage("LLMAgent", "RequestTasks");
        }
        if (acceptParentBridgeMessage(event.data?.type, "task-detail-request") && unityInstance) {
          unityInstance.SendMessage("LLMAgent", "RequestTaskDetail", String(event.data.entryId || ""));
        }
        if (acceptParentBridgeMessage(event.data?.type, "task-clear") && unityInstance) {
          unityInstance.SendMessage("LLMAgent", "ClearTask");
        }
      });
      window.addEventListener("pagehide", clearAgent);

      function showBanner(message, type) {
        const item = document.createElement("div");
        item.className = type || "info";
        item.textContent = message;
        warning.appendChild(item);
        if (type !== "error") setTimeout(() => item.remove(), 6000);
      }

      if (!crossOriginIsolated) {
        showBanner("Preparing the secure browser runtime. The page may reload once.", "info");
      }

      function startUnity() {
        const buildUrl = "Build";
        // Keep every Unity bundle revision on a distinct URL. UnityCache is
        // persistent, so reusing this key after a deployment can otherwise
        // mix a previous data archive with the new player files.
        const buildVersion = "?v=20260816b";
        const config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb" + buildVersion,
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb" + buildVersion,
        workerUrl: buildUrl + "/Web.worker.js.unityweb" + buildVersion,
        codeUrl: buildUrl + "/Web.wasm.unityweb" + buildVersion,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "UrbanGround",
        productName: "UrbanGround",
        productVersion: "1.0",
        autoSyncPersistentDataPath: true,
        showBanner
        };

        const loader = document.createElement("script");
        loader.src = buildUrl + "/Web.loader.js" + buildVersion;
        loader.onload = () => createUnityInstance(canvas, config, value => {
          const percentage = Math.round(value * 100);
          progress.style.width = percentage + "%";
          status.textContent = percentage < 100 ? `Loading UrbanGround · ${percentage}%` : "Starting the sandbox";
        }).then(instance => {
          unityInstance = instance;
          loading.hidden = true;
          fullscreen.hidden = false;
          fullscreen.onclick = () => instance.SetFullscreen(1);
          canvas.focus();
          postParentBridgeMessage("unity-ready");
          startConfiguredAgent();
        }).catch(error => {
          status.textContent = "UrbanGround could not start";
          showBanner(String(error), "error");
        });
        loader.onerror = () => showBanner("The Unity loader could not be downloaded.", "error");
        document.body.appendChild(loader);
      }

      if (crossOriginIsolated) {
        startUnity();
      } else {
        status.textContent = "Preparing the secure browser runtime";
        setTimeout(() => {
          if (!crossOriginIsolated)
            showBanner("This browser could not enable the multithreaded Unity runtime. Try a current desktop Chrome, Edge, Firefox, or Safari release.", "error");
        }, 10000);
      }
    </script>
  </body>
</html>
