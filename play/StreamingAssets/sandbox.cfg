# HongKongSandbox runtime configuration
#
# The application searches in this order and uses the first file it finds:
#   1. -config <path> on the command line
#   2. sandbox.cfg beside the executable (or beside the .app on macOS)
#   3. StreamingAssets/sandbox.cfg (this packaged default)
#
# Lines beginning with #, ;, or // are comments. A [section] prefixes its keys.

[tileset]

# Optional LAN mirror containing f2/, building/, and infrastructure/ directories.
internal_base_url =

# Internal mirror probe timeout in seconds.
probe_timeout_seconds = 2
